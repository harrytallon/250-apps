<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>250 Squadron Applications</title>
  <meta http-equiv="Cache-Control" content="public, max-age=31536000">
  <meta http-equiv="Pragma" content="cache">
  <meta http-equiv="Expires" content="31536000">

  <style>
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 20px;
      padding-top: 70px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .app-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px 30px;
    }

    .app-button {
      width: 120px;
      height: 120px;
      background: white;
      border: 2px solid #ccc;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .app-button:hover {
      border-color: #888;
    }

    #header {
      width: 100%;
      background-color: #f5f5f5;
      border-bottom: 1px solid #ddd;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999;
    }

    #header nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    #footer {
      width: 100%;
      background-color: #f5f5f5;
      border-top: 1px solid #ddd;
      padding: 15px 20px;
      text-align: center;
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 999;
    }

    #footer h4 {
      margin: 0;
      font-size: 1.1rem;
    }

    #footer p {
      margin: 5px 0 0 0;
      font-size: 0.9rem;
      color: #555;
    }

    /* Navigation buttons */
    .nav-button {
      position: fixed;
      bottom: 80px;
      padding: 10px 18px;
      font-size: 0.95rem;
      border-radius: 6px;
      background-color: #ffffff;
      border: 1px solid #ccc;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .nav-button:hover {
      background-color: #f0f0f0;
    }

    #back-button {
      left: 20px;
    }

    #previous-button {
      right: 20px;
    }

  </style>
</head>

<body>

    <div id="header">
      <nav role="main">
        <h1>250 (Halifax) Squadron Applications</h1>
      </nav>
    </div>

    <h3>Course Selection</h3>

    <div class="app-grid">
      <div class="app-button" onclick="window.open('https://rafac-my.sharepoint.com/:f:/r/personal/liam_ingleby101_rafac_mod_gov_uk/Documents/ITF%20October%202025%20-%20Digital%20Logbooks?csf=1&web=1&e=4HQedI?prompt=select_account','window','toolbar=yes, menubar=no, resizable=yes');">
        March<br>2026
      </div>
      <div class="app-button" onclick="window.open('https://apps.250-hfx.xyz/prev-itf.html','window','toolbar=yes, menubar=no, resizable=yes');">
        Past<br>Courses
      </div>
    </div>


    <button id="back-button" class="nav-button" onclick="goBack()">
      Return
    </button>

    <div id="footer">
      <h4>250 (Halifax) Squadron Applications - On Premises Only</h4>
      <p>Made by Cpl H Tallon - © <span id="year"></span> - v2.0</p>
    </div>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      function goBack() {
        window.location.href = "https://apps.250-hfx.xyz/";
      }
    </script>
</body>
</html>
